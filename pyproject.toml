[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-software-discovery"
version = "0.1.0"
description = "Agent-based software inventory plugin for NetBox 4.5+"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Software Discovery contributors"}]
dependencies = []

[project.optional-dependencies]
agent = ["httpx>=0.27"]
test = ["pytest>=8.0", "pytest-django>=4.9", "ruff>=0.8"]

[project.scripts]
netbox-software-agent = "netbox_software_agent.cli:main"

[tool.setuptools.packages.find]
include = ["netbox_software_discovery*", "netbox_software_agent*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netbox_software_discovery.tests.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
