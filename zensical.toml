# NetBox Software Discovery documentation - built with Zensical (https://zensical.org), same design as shift-mox
#   pip install -r requirements-docs.txt
#   zensical serve            # preview on http://localhost:8000
#   zensical build --strict   # what CI runs

[project]
site_name = "NetBox Software Discovery"
site_description = "Agent-based software inventory for NetBox 4.5: packages, services, containers and pods, with version history"
site_url = "https://jwklijnsma.github.io/netbox-software-discovery/"
repo_url = "https://github.com/jwklijnsma/netbox-software-discovery"
repo_name = "jwklijnsma/netbox-software-discovery"
edit_uri = "edit/main/docs/"
copyright = "NetBox Software Discovery"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Requirements" = "requirements.md" },
    { "NetBox plugin" = "plugin.md" },
    { "Agent on Linux" = "agent-linux.md" },
    { "Agent on Windows" = "agent-windows.md" },
    { "Docker" = "docker.md" },
  ] },
  { "Configuration" = [
    { "Agent configuration" = "configuration.md" },
    { "Object matching" = "matching.md" },
    { "Proxmox" = "proxmox.md" },
  ] },
  { "Reference" = [
    { "API" = "api.md" },
    { "Security and operations" = "security.md" },
    { "Development and tests" = "development.md" },
    { "Roadmap" = "roadmap.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "material/package-variant-closed"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "deep orange"
toggle.icon = "material/weather-night"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "deep orange"
toggle.icon = "material/weather-sunny"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
